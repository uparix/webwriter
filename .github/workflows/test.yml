name: Test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Folder watching works differently on each system, so both are tested.
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Pandoc, for the Word export tests.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - if: runner.os == 'macOS'
        run: brew install pandoc
      - run: pandoc --version | head -1
      - run: npm ci
      - run: npm test
